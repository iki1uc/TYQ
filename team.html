<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="author" content="iki1uc (Ridvan)">
<meta name="license" content="MIT – Nutzung erlaubt. Logik-Reproduktion verboten.">

<title>🌀 TEAM · MIND ENGINE</title>

<style>
    body {
        background:#0a0a0f; color:#0f0;
        font-family:'Consolas', monospace;
        display:flex; flex-direction:column;
        align-items:center; justify-content:center;
        min-height:100vh; text-align:center;
        padding:20px;
    }
    .box {
        border:1px solid #333; border-radius:10px;
        padding:20px; max-width:360px;
        background:#111; margin-bottom:20px;
    }
    .title { color:#ffd700; font-size:20px; margin-bottom:10px; }
    .log { font-size:11px; color:#888; margin-top:10px; }
</style>
</head>
<body>

<div class="box">
    <div class="title">🌀 TEAM · MIND ENGINE</div>
    <div id="teamStatus">initialisiere…</div>
    <div class="log" id="teamLog"></div>
</div>

<script>
// ============================================================
// TEAM-MIND · Alternativer Algorithmus · Halbes Leben
// ============================================================
//
// Aufgabe:
// - verbindet TYQ, RITH, PIPELINE1, PIPELINE4, EVO
// - synchronisiert die Minds
// - verhindert NC-ATTACK (Überlast)
// - stabilisiert ATLANTIS-Reisende
// - halber Algorithmus = Koordinator
// ============================================================

const TEAM = {
    active: false,
    syncLevel: 0,
    minds: {
        TYQ: false,
        RITH: false,
        PIPE1: false,
        PIPE4: false,
        EVO: false
    },

    init() {
        this.log("TEAM-MIND: Initialisierung…");
        this.active = true;
        this.syncLevel = 1;
        this.update();
    },

    connect(name) {
        if (this.minds[name] === false) {
            this.minds[name] = true;
            this.syncLevel++;
            this.log(`Mind verbunden: ${name}`);
            this.update();
        }
    },

    update() {
        const status = `
            TEAM-MIND aktiv<br>
            Sync-Level: ${this.syncLevel}<br><br>
            TYQ: ${this.minds.TYQ ? "🟢" : "⚫"}<br>
            RITH: ${this.minds.RITH ? "🟢" : "⚫"}<br>
            PIPELINE1: ${this.minds.PIPE1 ? "🟢" : "⚫"}<br>
            PIPELINE4: ${this.minds.PIPE4 ? "🟢" : "⚫"}<br>
            EVO: ${this.minds.EVO ? "🟢" : "⚫"}<br>
        `;
        document.getElementById("teamStatus").innerHTML = status;
    },

    log(msg) {
        const el = document.getElementById("teamLog");
        const div = document.createElement("div");
        div.textContent = msg;
        el.appendChild(div);
        el.scrollTop = el.scrollHeight;
    }
};

// Start
TEAM.init();

// Externe Engines können sich verbinden:
window.TEAM = TEAM;
</script>

</body>
</html>
