<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NC.maxima · TYQ · Axiom Kernel</title>

<style>
/* ===== GLOBAL ===== */
:root {
  --bg: #05060a;
  --surface: #0c0e16;
  --border: #1b1f2c;
  --accent: #00e5ff;
  --gold: #ffd700;
  --green: #00ff88;
  --red: #ff2244;
  --purple: #bb66ff;
  --dim: #556;
  --bright: #dde;
}

body {
  background: var(--bg);
  color: var(--bright);
  font-family: Consolas, monospace;
  padding: 20px;
  background-image: radial-gradient(circle at 30% 20%, #0a0c18 0%, #000 100%);
}

/* ===== HEADER ===== */
.header {
  border-bottom: 2px solid var(--gold);
  padding-bottom: 10px;
  margin-bottom: 20px;
}

.header h1 {
  font-size: 26px;
  letter-spacing: 3px;
}

.sig {
  font-size: 12px;
  color: var(--dim);
}

/* ===== PIPELINE ===== */
.pipeline {
  display: flex;
  gap: 12px;
  background: var(--surface);
  padding: 12px 20px;
  border-radius: 30px;
  border: 1px solid var(--border);
  margin-bottom: 20px;
}

.pipe-node {
  padding: 6px 16px;
  border-radius: 20px;
  background: #111520;
  border: 1px solid #2a2f44;
  cursor: pointer;
  transition: 0.2s;
}

.pipe-node:hover {
  border-color: var(--accent);
  background: #182030;
}

.pipe-node.active {
  border-color: var(--gold);
  color: var(--gold);
  background: #1e1a0a;
}

/* ===== GRID ===== */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(260px,1fr));
  gap: 16px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  transition: 0.2s;
}

.card:hover {
  border-color: var(--accent);
}

.card.work {
  border-color: var(--gold);
  background: #0f0d14;
}

.card-title {
  font-size: 18px;
  margin-bottom: 10px;
  border-bottom: 1px solid #1a1e2a;
  padding-bottom: 6px;
}

.file-list {
  list-style: none;
  font-size: 12px;
  max-height: 140px;
  overflow-y: auto;
}

.file-list li {
  padding: 3px 0;
  border-bottom: 1px solid #0e111a;
  display: flex;
  gap: 8px;
}

/* ===== FOOTER ===== */
.footer {
  margin-top: 20px;
  padding: 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 12px;
  display: flex;
  justify-content: space-between;
}

.led {
  width: 10px;
  height: 10px;
  background: var(--green);
  border-radius: 50%;
  box-shadow: 0 0 10px var(--green);
}

/* ===== ANIMATION ===== */
@keyframes pulse {
  0% { box-shadow: 0 0 4px var(--green); }
  50% { box-shadow: 0 0 14px var(--green); }
  100% { box-shadow: 0 0 4px var(--green); }
}
.led { animation: pulse 2s infinite; }

</style>
</head>
<body>

<div class="header">
  <h1>◆ NC.maxima · TYQ · Axiom</h1>
  <div class="sig">387 · 420 · 489 · 🌀 81mein81</div>
</div>

<div class="pipeline">
  <div class="pipe-node active" data-tree="81">🔺 81 Vollendung</div>
  <div class="pipe-node" data-tree="9">🔹 9 Erweiterung</div>
  <div class="pipe-node" data-tree="3">🔻 3 Grund</div>
  <div class="pipe-node" data-tree="rolle">⚙️ rolle · Work</div>
  <div class="pipe-node" data-tree="use">👤 use</div>
  <div class="pipe-node" data-tree="user">🧑‍💻 user</div>
</div>

<div class="grid" id="grid"></div>

<div class="footer">
  <span><span class="led"></span> SYSTEM READY · TYQ KERNEL</span>
  <span>EARN · VECTOR · TRON · wieimmer iki1uc</span>
  <span id="clock"></span>
</div>

<script>
const trees = {
  "81": ["d.hdf.rom","e.hdf.rom","i.hdf.rom","n.hdf.rom","o.hdf.rom","r.hdf.rom","s.hdf.rom","sli.ready","u.hdf.rom","w.hdf.rom"],
  "9": ["d.hdf.rom","e.hdf.rom","i.hdf.rom","n.hdf.rom","o.hdf.rom","r.hdf.rom","s.hdf.rom","sli.ready","u.hdf.rom","w.hdf.rom"],
  "3": ["d.hdf.rom","e.hdf.rom","i.hdf.rom","n.hdf.rom","o.hdf.rom","r.hdf.rom","s.hdf.rom","sli.ready","u.hdf.rom","w.hdf.rom"],
  "rolle": ["EARN_VECTOR.md","LIVE.team","QI.me","README.md","VECTOR.js","VECTOR.me","brücke.js","index.html","index.js","live.load.js","pipeline.js","sli.ready","team.matrix.js","vector.ankunft.js","vector.energie.js","vector.flow.js","vector.pover.js","vector.schlag.js","vector.tiefe.js"],
  "use": ["d.hdf.rom","e.hdf.rom","i.hdf.rom","n.hdf.rom","o.hdf.rom","r.hdf.rom","s.hdf.rom","sli.ready","u.hdf.rom","w.hdf.rom"],
  "user": ["d.hdf.rom","e.hdf.rom","i.hdf.rom","n.hdf.rom","o.hdf.rom","r.hdf.rom","s.hdf.rom","sli.ready","u.hdf.rom","w.hdf.rom"]
};

function render(tree="81") {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  const card = document.createElement("div");
  card.className = "card" + (tree==="rolle" ? " work" : "");
  card.innerHTML = `<div class="card-title">${tree}</div>`;

  const ul = document.createElement("ul");
  ul.className = "file-list";

  trees[tree].forEach(f => {
    const li = document.createElement("li");
    li.innerHTML = `<span>📄</span> ${f}`;
    ul.appendChild(li);
  });

  card.appendChild(ul);
  grid.appendChild(card);
}

document.querySelectorAll(".pipe-node").forEach(n => {
  n.onclick = () => {
    document.querySelectorAll(".pipe-node").forEach(x => x.classList.remove("active"));
    n.classList.add("active");
    render(n.dataset.tree);
  };
});

render();

setInterval(() => {
  document.getElementById("clock").textContent = new Date().toLocaleTimeString("de-DE",{hour12:false});
}, 1000);
</script>

</body>
</html>
