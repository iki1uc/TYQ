<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ID.html · TYQ Flow Engine</title>

<style>
:root {
  --bg: #05060a;
  --surface: #0c0e16;
  --accent: #00e5ff;
  --gold: #ffd700;
  --green: #00ff88;
  --red: #ff2244;
  --purple: #bb66ff;
  --bright: #dde;
  --dim: #556;
}

body {
  background: var(--bg);
  color: var(--bright);
  font-family: Consolas, monospace;
  padding: 20px;
}

/* HEADER */
h1 {
  font-size: 28px;
  letter-spacing: 3px;
  color: var(--accent);
  text-shadow: 0 0 12px var(--accent);
}

/* FLOW CANVAS */
#flowCanvas {
  width: 100%;
  height: 240px;
  background: #0a0d14;
  border: 1px solid #1b1f2c;
  border-radius: 12px;
  margin: 20px 0;
  position: relative;
  overflow: hidden;
}

/* FLOW PARTICLES */
.particle {
  position: absolute;
  width: 6px;
  height: 6px;
  background: var(--green);
  border-radius: 50%;
  box-shadow: 0 0 10px var(--green);
  animation: drift 3s linear infinite;
}

@keyframes drift {
  from { transform: translateY(0px); opacity: 1; }
  to { transform: translateY(-200px); opacity: 0; }
}

/* PIPELINE */
.pipeline {
  display: flex;
  gap: 12px;
  margin-bottom: 20px;
}

.pipe {
  padding: 6px 16px;
  border-radius: 20px;
  background: #111520;
  border: 1px solid #2a2f44;
  cursor: pointer;
  transition: 0.2s;
}

.pipe:hover {
  border-color: var(--accent);
  background: #182030;
}

.pipe.active {
  border-color: var(--gold);
  color: var(--gold);
  background: #1e1a0a;
}

/* ID BOX */
#idBox {
  margin-top: 20px;
  padding: 12px;
  background: var(--surface);
  border: 1px solid #1b1f2c;
  border-radius: 12px;
}

#idInput {
  width: 100%;
  padding: 8px;
  background: #111520;
  border: 1px solid #2a2f44;
  color: var(--bright);
  border-radius: 8px;
}
